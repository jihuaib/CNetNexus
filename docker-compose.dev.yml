# 开发环境 Docker Compose 配置
# 使用方式：
#   交互式: docker compose -f docker-compose.dev.yml run --rm dev
#   后台:   docker compose -f docker-compose.dev.yml up -d
#           docker exec -it netnexus-dev bash

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: netnexus:dev
    container_name: netnexus-dev
    stdin_open: true
    tty: true
    ports:
      - "3788:3788"
    volumes:
      # 挂载源码目录，宿主机编辑 -> 容器内构建
      - .:/workspace
      # 持久化构建产物，避免每次重建
      - netnexus-dev-build:/workspace/build
      # 持久化开发数据库
      - netnexus-dev-data:/workspace/data
    # 特权模式：macOS Docker Desktop 的 VM 层会限制 netlink 操作，
    # 仅 cap_add: NET_ADMIN 不够，需要 privileged 才能创建 veth 接口
    privileged: true
    networks:
      - dev-net

volumes:
  netnexus-dev-build:
    driver: local
  netnexus-dev-data:
    driver: local

networks:
  dev-net:
    driver: bridge

name: Topology Module Smoke

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  topology-module-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Probe & enable VRF kernel module on host
        run: |
          set -e
          uname -r
          # 先尝试加载；若 vrf.ko 不存在则按需补装 extra modules 包
          if ! grep -qE '^vrf\s' /proc/modules; then
            if ! sudo modprobe vrf 2>/dev/null; then
              sudo apt-get update -y
              sudo apt-get install -y linux-modules-extra-azure || true
              sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
              sudo modprobe vrf || {
                echo "::warning::vrf kernel module unavailable; VRF OS install will fail in CI"
                ls /lib/modules/$(uname -r)/kernel/drivers/net/vrf.ko* 2>&1 || true
                exit 0
              }
            fi
          fi
          grep -E '^vrf\s' /proc/modules

      - name: Load MPLS kernel modules
        run: |
          set -e
          for mod in mpls_router mpls_iptunnel; do
            if ! grep -qE "^${mod}\\s" /proc/modules; then
              sudo modprobe "$mod" || {
                echo "::warning::${mod} kernel module unavailable; MPLS sysctl will fail in CI"
                exit 0
              }
            fi
            grep -E "^${mod}\\s" /proc/modules
          done

      - name: Enable core dumps
        run: |
          set -e
          sudo mkdir -p /var/lib/netnexus-cores
          sudo chmod 1777 /var/lib/netnexus-cores
          sudo sysctl -w kernel.core_pattern=/var/lib/netnexus-cores/core.%e.%p.%t
          sudo sysctl -w kernel.core_uses_pid=0
          cat /proc/sys/kernel/core_pattern

      - name: Run All CI Modules And Generate Report
        env:
          NN_CORE_DIR: /var/lib/netnexus-cores
        run: |
          ulimit -c unlimited
          scripts/ci/run_all.sh \
            --image "netnexus-ci:${{ github.sha }}" \
            --frr-image "netnexus-frr-ci:${{ github.sha }}" \
            --report-dir "scripts/ci/reports" \
            --debug \
            --cmd-timeout 30 \
            --connect-timeout 90

      - name: Collect Debug Symbols
        if: always()
        run: |
          set -e
          mkdir -p scripts/ci/reports/debug-build
          if docker image inspect "netnexus-ci:${{ github.sha }}" >/dev/null 2>&1; then
            docker run --rm \
              -v "$PWD/scripts/ci/reports/debug-build:/out" \
              "netnexus-ci:${{ github.sha }}" \
              /bin/bash -lc 'cp -a /opt/netnexus/bin /out/ && cp -a /opt/netnexus/lib /out/'
            find scripts/ci/reports/debug-build -maxdepth 2 -type f -ls
          else
            echo "Debug image netnexus-ci:${{ github.sha }} not found; skip symbol collection"
          fi

      - name: Generate Core Backtraces
        if: always()
        run: |
          set -e
          if ! docker image inspect "netnexus-ci:${{ github.sha }}" >/dev/null 2>&1; then
            echo "Debug image netnexus-ci:${{ github.sha }} not found; skip core backtraces"
            exit 0
          fi
          if ! find scripts/ci/reports/core-dumps -type f -name 'core.*' ! -name '*.gdb.txt' -print -quit 2>/dev/null | grep -q .; then
            echo "No core dumps found; skip core backtraces"
            exit 0
          fi
          docker run --rm \
            -v "$PWD:/build:ro" \
            -v "$PWD/scripts/ci/reports:/reports" \
            "netnexus-ci:${{ github.sha }}" \
            /bin/bash -lc '
              set -e
              while IFS= read -r core; do
                out="${core}.gdb.txt"
                {
                  echo "core: ${core}"
                  echo "binary: /opt/netnexus/bin/netnexus"
                  echo
                  gdb -batch \
                    -ex "set pagination off" \
                    -ex "set confirm off" \
                    -ex "set solib-search-path /opt/netnexus/lib" \
                    -ex "info files" \
                    -ex "info sharedlibrary" \
                    -ex "thread apply all bt full" \
                    /opt/netnexus/bin/netnexus "${core}"
                } > "${out}" 2>&1 || true
                echo "Wrote ${out}"
              done < <(find /reports/core-dumps -type f -name "core.*" ! -name "*.gdb.txt" | sort)
            '

      - name: Publish CI Summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          summary_path = Path("scripts/ci/reports/summary.json")
          out = Path("${GITHUB_STEP_SUMMARY}")

          lines = []
          lines.append("## Topology Module Smoke Report")
          lines.append("")

          if not summary_path.exists():
              lines.append("summary.json not found. Please check runner logs.")
          else:
              data = json.loads(summary_path.read_text(encoding="utf-8"))
              total = int(data.get("total", 0))
              passed = int(data.get("passed", 0))
              failed = int(data.get("failed", 0))
              duration = data.get("duration_sec", "n/a")

              lines.append(f"- Total checks: **{total}**")
              lines.append(f"- Passed: **{passed}**")
              lines.append(f"- Failed: **{failed}**")
              lines.append(f"- Duration: **{duration}s**")
              lines.append("")

              if failed:
                  lines.append("### Failed Checks")
                  lines.append("")
                  lines.append("| Case | Script | Return Code |")
                  lines.append("| --- | --- | --- |")
                  for item in data.get("results", []):
                      if int(item.get("returncode", 0)) != 0:
                          case = item.get("case", "")
                          script = item.get("script", "")
                          rc = item.get("returncode", "")
                          lines.append(f"| `{case}` | `{script}` | `{rc}` |")
                  lines.append("")

          lines.append(
              "Download artifact `topology-module-report-<run_id>` for full `report.html`, "
              "`summary.json`, `logs/*.log`, `containers/*/*/modules/*.log`, and any "
              "`core-dumps/<case>/<script>/core.*` files. CI-generated x86 backtraces are "
              "`core.*.gdb.txt`; debug binaries are under `debug-build/bin` and `debug-build/lib`."
          )
          lines.append("")

          out.write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Upload Module Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topology-module-report-${{ github.run_id }}
          path: scripts/ci/reports
          if-no-files-found: error

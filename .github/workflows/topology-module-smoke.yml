name: Topology Module Smoke

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build-ci-images:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ASAN CI Images
        run: |
          set -euo pipefail
          docker build \
            --target debug \
            --build-arg BUILD_TYPE=Debug \
            --build-arg ENABLE_ASAN=ON \
            -t "netnexus-ci:${{ github.sha }}" \
            .
          docker build \
            -f scripts/ci/images/frr/Dockerfile \
            -t "netnexus-frr-ci:${{ github.sha }}" \
            scripts/ci/images/frr

      - name: Export CI Images
        run: |
          set -euo pipefail
          mkdir -p /tmp/netnexus-ci-images
          docker save "netnexus-ci:${{ github.sha }}" | gzip -1 > /tmp/netnexus-ci-images/netnexus-ci.tar.gz
          docker save "netnexus-frr-ci:${{ github.sha }}" | gzip -1 > /tmp/netnexus-ci-images/netnexus-frr-ci.tar.gz
          ls -lh /tmp/netnexus-ci-images

      - name: Upload CI Images
        uses: actions/upload-artifact@v4
        with:
          name: topology-ci-images-${{ github.run_id }}
          path: /tmp/netnexus-ci-images
          if-no-files-found: error
          retention-days: 3

      - name: Collect Debug Symbols
        run: |
          set -euo pipefail
          mkdir -p /tmp/netnexus-debug-build
          docker run --rm \
            -v /tmp/netnexus-debug-build:/out \
            "netnexus-ci:${{ github.sha }}" \
            /bin/bash -lc 'cp -a /opt/netnexus/bin /out/ && cp -a /opt/netnexus/lib /out/'
          find /tmp/netnexus-debug-build -maxdepth 2 -type f -ls

      - name: Upload Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: topology-debug-build-${{ github.run_id }}
          path: /tmp/netnexus-debug-build
          if-no-files-found: error
          retention-days: 3

  topology-module-smoke:
    needs: build-ci-images
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { name: shard-1, index: 0, count: 6 }
          - { name: shard-2, index: 1, count: 6 }
          - { name: shard-3, index: 2, count: 6 }
          - { name: shard-4, index: 3, count: 6 }
          - { name: shard-5, index: 4, count: 6 }
          - { name: shard-6, index: 5, count: 6 }
    name: Topology Module Smoke (${{ matrix.shard.name }})
    env:
      REPORT_DIR: scripts/ci/reports/${{ matrix.shard.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Download CI Images
        uses: actions/download-artifact@v4
        with:
          name: topology-ci-images-${{ github.run_id }}
          path: /tmp/netnexus-ci-images

      - name: Load CI Images
        run: |
          set -euo pipefail
          gzip -dc /tmp/netnexus-ci-images/netnexus-ci.tar.gz | docker load
          gzip -dc /tmp/netnexus-ci-images/netnexus-frr-ci.tar.gz | docker load
          rm -f /tmp/netnexus-ci-images/*.tar.gz
          docker image inspect "netnexus-ci:${{ github.sha }}" >/dev/null
          docker image inspect "netnexus-frr-ci:${{ github.sha }}" >/dev/null
          docker system df

      - name: Probe & enable VRF kernel module on host
        run: |
          set -e
          uname -r
          # 先尝试加载；若 vrf.ko 不存在则按需补装 extra modules 包
          if ! grep -qE '^vrf\s' /proc/modules; then
            if ! sudo modprobe vrf 2>/dev/null; then
              sudo apt-get update -y
              sudo apt-get install -y linux-modules-extra-azure || true
              sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
              sudo modprobe vrf || {
                echo "::warning::vrf kernel module unavailable; VRF OS install will fail in CI"
                ls /lib/modules/$(uname -r)/kernel/drivers/net/vrf.ko* 2>&1 || true
                exit 0
              }
            fi
          fi
          grep -E '^vrf\s' /proc/modules

      - name: Load MPLS kernel modules
        run: |
          set -e
          for mod in mpls_router mpls_iptunnel; do
            if ! grep -qE "^${mod}\\s" /proc/modules; then
              sudo modprobe "$mod" || {
                echo "::warning::${mod} kernel module unavailable; MPLS sysctl will fail in CI"
                exit 0
              }
            fi
            grep -E "^${mod}\\s" /proc/modules
          done

      - name: Enable core dumps
        run: |
          set -e
          sudo mkdir -p /var/lib/netnexus-cores
          sudo chmod 1777 /var/lib/netnexus-cores
          sudo sysctl -w kernel.core_pattern=/var/lib/netnexus-cores/core.%e.%p.%t
          sudo sysctl -w kernel.core_uses_pid=0
          cat /proc/sys/kernel/core_pattern

      - name: Run CI Module Shard
        env:
          NN_CORE_DIR: /var/lib/netnexus-cores
          CNETNEXUS_FRR_IMAGE: netnexus-frr-ci:${{ github.sha }}
        run: |
          set -euo pipefail
          ulimit -c unlimited
          rm -rf "${REPORT_DIR}"
          python3 scripts/ci/module_runner.py \
            --image "netnexus-ci:${{ github.sha }}" \
            --report-dir "${REPORT_DIR}" \
            --cmd-timeout 90 \
            --connect-timeout 90 \
            --shard-count "${{ matrix.shard.count }}" \
            --shard-index "${{ matrix.shard.index }}"

      - name: Generate Core Backtraces
        if: always()
        run: |
          set -e
          if ! docker image inspect "netnexus-ci:${{ github.sha }}" >/dev/null 2>&1; then
            echo "Debug image netnexus-ci:${{ github.sha }} not found; skip core backtraces"
            exit 0
          fi
          if ! find "${REPORT_DIR}/core-dumps" -type f -name 'core.*' ! -name '*.gdb.txt' -print -quit 2>/dev/null | grep -q .; then
            echo "No core dumps found; skip core backtraces"
            exit 0
          fi
          docker run --rm \
            -v "$PWD:/build:ro" \
            -v "$PWD/${REPORT_DIR}:/reports" \
            "netnexus-ci:${{ github.sha }}" \
            /bin/bash -lc '
              set -e
              while IFS= read -r core; do
                out="${core}.gdb.txt"
                {
                  echo "core: ${core}"
                  echo "binary: /opt/netnexus/bin/netnexus"
                  echo
                  gdb -batch \
                    -ex "set pagination off" \
                    -ex "set confirm off" \
                    -ex "set solib-search-path /opt/netnexus/lib" \
                    -ex "info files" \
                    -ex "info sharedlibrary" \
                    -ex "thread apply all bt full" \
                    /opt/netnexus/bin/netnexus "${core}"
                } > "${out}" 2>&1 || true
                echo "Wrote ${out}"
              done < <(find /reports/core-dumps -type f -name "core.*" ! -name "*.gdb.txt" | sort)
            '

      - name: Publish CI Summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report_dir = Path(os.environ["REPORT_DIR"])
          summary_path = report_dir / "summary.json"
          out = Path(os.environ["GITHUB_STEP_SUMMARY"])

          lines = []
          lines.append("## Topology Module Smoke Report")
          lines.append("")
          lines.append(f"- Shard: **${{ matrix.shard.name }}**")

          if not summary_path.exists():
              lines.append("- summary.json not found. Please check runner logs.")
          else:
              data = json.loads(summary_path.read_text(encoding="utf-8"))
              total = int(data.get("total", 0))
              passed = int(data.get("passed", 0))
              failed = int(data.get("failed", 0))
              duration = data.get("duration_sec", "n/a")

              lines.append(f"- Total checks: **{total}**")
              lines.append(f"- Passed: **{passed}**")
              lines.append(f"- Failed: **{failed}**")
              lines.append(f"- Duration: **{duration}s**")
              lines.append("")

              if failed:
                  lines.append("### Failed Checks")
                  lines.append("")
                  lines.append("| Case | Script | Return Code |")
                  lines.append("| --- | --- | --- |")
                  for item in data.get("results", []):
                      if int(item.get("returncode", 0)) != 0:
                          case = item.get("case", "")
                          script = item.get("script", "")
                          rc = item.get("returncode", "")
                          lines.append(f"| `{case}` | `{script}` | `{rc}` |")
                  lines.append("")

          lines.append(
              "Download artifact `topology-module-report-<run_id>-<shard>` for full "
              "`report.html`, `summary.json`, `logs/*.log`, `containers/*/*/modules/*.log`, "
              "and any `core-dumps/<case>/<script>/core.*` files. CI-generated x86 "
              "backtraces are `core.*.gdb.txt`. Debug binaries are attached once to the "
              "combined artifact under `debug-build/bin` and `debug-build/lib`."
          )
          lines.append("")

          out.write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Upload Module Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topology-module-report-${{ github.run_id }}-${{ matrix.shard.name }}
          path: |
            scripts/ci/reports/${{ matrix.shard.name }}
            !scripts/ci/reports/${{ matrix.shard.name }}/debug-build
            !scripts/ci/reports/${{ matrix.shard.name }}/debug-build/**
          if-no-files-found: error

  merge-topology-report:
    needs: topology-module-smoke
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Download Shard Reports
        uses: actions/download-artifact@v4
        with:
          pattern: topology-module-report-${{ github.run_id }}-shard-*
          path: /tmp/topology-shard-reports

      - name: Merge Shard Reports
        run: |
          set -euo pipefail
          rm -rf scripts/ci/reports/combined
          python3 scripts/ci/merge_module_reports.py \
            --input-root /tmp/topology-shard-reports \
            --output-dir scripts/ci/reports/combined \
            --modules-dir scripts/ci/modules

      - name: Download Debug Symbols
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: topology-debug-build-${{ github.run_id }}
          path: scripts/ci/reports/combined/debug-build

      - name: Publish Combined CI Summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          summary_path = Path("scripts/ci/reports/combined/summary.json")
          out = Path("${GITHUB_STEP_SUMMARY}")

          lines = []
          lines.append("## Combined Topology Module Smoke Report")
          lines.append("")

          if not summary_path.exists():
              lines.append("summary.json not found. Please check merge job logs.")
          else:
              data = json.loads(summary_path.read_text(encoding="utf-8"))
              total = int(data.get("total", 0))
              passed = int(data.get("passed", 0))
              failed = int(data.get("failed", 0))
              duration = data.get("duration_sec", "n/a")

              lines.append(f"- Total checks: **{total}**")
              lines.append(f"- Passed: **{passed}**")
              lines.append(f"- Failed: **{failed}**")
              lines.append(f"- Wall-clock span: **{duration}s**")
              lines.append("")

              if failed:
                  lines.append("### Failed Checks")
                  lines.append("")
                  lines.append("| Case | Script | Return Code |")
                  lines.append("| --- | --- | --- |")
                  for item in data.get("results", []):
                      if int(item.get("returncode", 0)) != 0:
                          case = item.get("case", "")
                          script = item.get("script", "")
                          rc = item.get("returncode", "")
                          lines.append(f"| `{case}` | `{script}` | `{rc}` |")
                  lines.append("")

          lines.append(
              "Download artifact `topology-module-report-<run_id>` for the combined `report.html`. "
              "The merged artifact keeps each shard report under `shards/` and one shared "
              "`debug-build/` at the artifact root."
          )
          lines.append("")

          out.write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Upload Combined Module Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topology-module-report-${{ github.run_id }}
          path: scripts/ci/reports/combined
          if-no-files-found: error

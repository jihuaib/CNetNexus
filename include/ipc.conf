# IPC 模块地址配置
# 格式: module_id  name  host  port
#
# module_id 定义 (见 include/dev.h):
#   0x00000001  DEV
#   0x00000002  DB
#   0x00000003  CLI
#   0x00000004  IF
#   0x00000005  BGP
#   0x00000006  ROUTE

0x00000001  dev    127.0.0.1  4001
0x00000002  db     127.0.0.1  4002
0x00000003  cli    127.0.0.1  4003
0x00000004  if     127.0.0.1  4004
0x00000005  bgp    127.0.0.1  4005
0x00000006  route  127.0.0.1  4006
